name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Linux libraries
        run: |
          # Ubuntu-host DNS outage 2026-11-11: on GitHub's x64 Ubuntu runners, try mirrors.kernel.org first, then Azure.
          if [ -f /etc/apt/apt-mirrors.txt ] && [ "$(dpkg --print-architecture)" = amd64 ]; then
            printf "http://mirrors.kernel.org/ubuntu/\nhttp://azure.archive.ubuntu.com/ubuntu/\n" | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
            sudo sed -i -E "s#https?://(security|archive|azure\.archive)\.ubuntu\.com/ubuntu#http://mirrors.kernel.org/ubuntu#g" /etc/apt/sources.list.d/ubuntu.sources 2>/dev/null || true
          fi
          for i in 1 2 3; do sudo apt-get -o Acquire::Retries=3 update && break; sleep 20; done
          sudo apt-get -o Acquire::Retries=3 install -y libxkbcommon-x11-0 libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - name: The quality gate
        run: cargo xtask ci
